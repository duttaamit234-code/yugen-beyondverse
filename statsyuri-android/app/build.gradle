plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.yugen.statsyuri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugen.statsyuri'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"

        pip {
            install "numpy"
            install "pandas"
            install "scipy"
            install "statsmodels"
            install "openpyxl"
            install "xlrd"
        }
    }

    sourceSets {
        main {
            srcDirs = ["../../yugen-analytica", "src/main/python"]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Credential Manager + Sign in with Google. The app uses the modern Google Identity flow.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
}
