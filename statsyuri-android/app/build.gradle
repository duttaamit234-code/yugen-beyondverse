plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yugen.statsyuri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugen.statsyuri'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.5.0-full-stats'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Small, pure-Java numerical library. No Google services, Python runtime,
    // AppCompat, or heavyweight UI framework is loaded by the app.
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
