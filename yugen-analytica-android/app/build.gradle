plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yugenbeyondverse.statsyuri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugenbeyondverse.statsyuri'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.7.2-installable'
    }

    buildTypes {
        release {
            // Do not shrink this build. The previous R8 configuration produced
            // an APK without classes.dex, which made the APK impossible to install.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
