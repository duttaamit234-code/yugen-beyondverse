plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yugenbeyondverse.statsyuri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugenbeyondverse.statsyuri'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '0.7.3-stable'
    }

    buildTypes {
        release {
            // Reliability first for this M21 build. R8 can be enabled later
            // after the complete native path is proven on-device.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
