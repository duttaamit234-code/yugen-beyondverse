plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yugenbeyondverse.statsyuri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugenbeyondverse.statsyuri'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.7.0-native-full'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
