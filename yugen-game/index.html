<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Yugen: The World That Remembers</title>
</head>
<body>
  <div id="game"></div>

  <div id="rotate-overlay" role="dialog" aria-label="Landscape mode required">
    <div class="rotate-card">
      <div class="rotate-icon">↔</div>
      <h1>YUGEN</h1>
      <p>Turn your phone sideways.</p>
      <small>This game is designed for landscape play.</small>
      <button id="rotate-button" type="button">ENTER LANDSCAPE</button>
    </div>
  </div>

  <div id="boot-message">
    <div>
      YUGEN
      <small>THE WORLD THAT REMEMBERS<br>Awakening the village…</small>
      <div id="boot-error"></div>
    </div>
  </div>

  <!-- Loaded before the game so it can patch scene creation safely. -->
  <script type="module" src="./src/systems/NavigationHUD.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
