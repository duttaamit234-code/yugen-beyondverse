<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Yugen: The World That Remembers</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #080a10; overflow: hidden; touch-action: none; }
    #game { width: 100%; height: 100%; }
    #boot-message { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at center, #151a28 0%, #080a10 68%); color: #eee9dc; font: 600 18px Georgia, serif; z-index: 9999; letter-spacing: .08em; text-align: center; }
    #boot-message small { display: block; margin-top: 10px; font: 13px system-ui, sans-serif; color: #9fa9b5; letter-spacing: 0; }
    #boot-error { display: none; max-width: 90vw; margin-top: 18px; white-space: pre-wrap; color: #ffb4b4; font: 12px/1.45 monospace; text-align: left; letter-spacing: 0; }

    #mobile-controls { display: none; position: fixed; inset: 0; z-index: 5000; pointer-events: none; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    #joystick { position: absolute; left: 26px; bottom: calc(26px + env(safe-area-inset-bottom)); width: 148px; height: 148px; border-radius: 50%; background: rgba(16,21,37,.62); border: 2px solid rgba(205,215,232,.48); box-shadow: 0 6px 24px rgba(0,0,0,.28); pointer-events: auto; touch-action: none; }
    #joystick::after { content: ''; position: absolute; inset: 25%; border: 2px solid rgba(151,164,188,.34); border-radius: 50%; }
    #stick { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; background: rgba(225,231,241,.82); border: 2px solid rgba(255,255,255,.6); box-sizing: border-box; pointer-events: none; }
    #move-label { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); color: rgba(225,231,241,.85); font-size: 10px; letter-spacing: 1.6px; }
    .mobile-action { position: absolute; width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255,232,167,.65); background: rgba(36,30,40,.82); color: #fff1b0; font-weight: 700; font-size: 18px; pointer-events: auto; touch-action: manipulation; box-shadow: 0 6px 22px rgba(0,0,0,.3); }
    #action-e { right: 26px; bottom: calc(124px + env(safe-area-inset-bottom)); }
    #action-next { right: 118px; bottom: calc(30px + env(safe-area-inset-bottom)); width: 94px; border-radius: 26px; font-size: 13px; }
    #mobile-hint { position: absolute; right: 24px; bottom: calc(12px + env(safe-area-inset-bottom)); color: rgba(230,232,238,.7); font-size: 10px; letter-spacing: 1px; pointer-events: none; }
    @media (pointer: coarse), (max-width: 900px) {
      #mobile-controls { display: block; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="mobile-controls" aria-label="Mobile game controls">
    <div id="joystick" aria-label="Move joystick"><span id="move-label">MOVE</span><div id="stick"></div></div>
    <button class="mobile-action" id="action-e" type="button">E</button>
    <button class="mobile-action" id="action-next" type="button">NEXT</button>
    <div id="mobile-hint">E = interact · NEXT = dialogue</div>
  </div>

  <div id="boot-message">
    <div>YUGEN<small>THE WORLD THAT REMEMBERS<br>Awakening the village…</small><div id="boot-error"></div></div>
  </div>

  <script>
    (() => {
      const pressed = new Set();
      const keyEvent = (type, key, code) => {
        window.dispatchEvent(new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true }));
      };
      const press = (key, code) => { if (!pressed.has(code)) { pressed.add(code); keyEvent('keydown', key, code); } };
      const release = (key, code) => { if (pressed.has(code)) { pressed.delete(code); keyEvent('keyup', key, code); } };
      const releaseAll = () => { [...pressed].forEach(code => { const key = ({KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d'})[code] || ''; if (key) release(key, code); }); };

      const joystick = document.getElementById('joystick');
      const stick = document.getElementById('stick');
      let activePointer = null;
      const radius = 48;
      const updateStick = (clientX, clientY) => {
        const r = joystick.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let dx = clientX - cx, dy = clientY - cy;
        const len = Math.hypot(dx, dy) || 1;
        if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        const nx = dx / radius, ny = dy / radius;
        const left = nx < -0.20, right = nx > 0.20, up = ny < -0.20, down = ny > 0.20;
        left ? press('a','KeyA') : release('a','KeyA');
        right ? press('d','KeyD') : release('d','KeyD');
        up ? press('w','KeyW') : release('w','KeyW');
        down ? press('s','KeyS') : release('s','KeyS');
      };
      const resetJoystick = () => { activePointer = null; stick.style.transform = 'translate(0,0)'; releaseAll(); };
      joystick.addEventListener('pointerdown', e => { e.preventDefault(); activePointer = e.pointerId; joystick.setPointerCapture?.(e.pointerId); updateStick(e.clientX,e.clientY); });
      joystick.addEventListener('pointermove', e => { if (e.pointerId === activePointer) { e.preventDefault(); updateStick(e.clientX,e.clientY); } });
      joystick.addEventListener('pointerup', e => { if (e.pointerId === activePointer) resetJoystick(); });
      joystick.addEventListener('pointercancel', resetJoystick);
      window.addEventListener('blur', resetJoystick);
      document.addEventListener('visibilitychange', () => { if (document.hidden) resetJoystick(); });

      const bindTap = (id, key, code) => {
        const el = document.getElementById(id);
        const down = e => { e.preventDefault(); e.stopPropagation(); press(key, code); el.style.transform = 'scale(.94)'; };
        const up = e => { e.preventDefault(); e.stopPropagation(); release(key, code); el.style.transform = 'scale(1)'; };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('pointerleave', up);
      };
      bindTap('action-e','e','KeyE');
      bindTap('action-next',' ','Space');
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
