<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Yugen • Phase 2 3D Test</title>
  <style>
    html,body,#phase2{width:100%;height:100%;margin:0;overflow:hidden;background:#101827}
    #phase2{position:fixed;inset:0}
    #phase2-label{position:fixed;z-index:5;top:14px;left:14px;padding:8px 12px;background:#080b13cc;color:#eee8d8;border:1px solid #596178;font:600 12px sans-serif;letter-spacing:1px;pointer-events:none}
  </style>
</head>
<body>
  <div id="phase2"></div>
  <div id="phase2-label">PHASE 2 • 3D TEST MAP</div>
  <script type="module">
    import { startPhase2Test } from './src/phase2/Phase2Test.js';
    try { startPhase2Test(document.getElementById('phase2')); }
    catch (error) { console.error('[PHASE 2]', error); document.getElementById('phase2-label').textContent = `PHASE 2 ERROR • ${error.message}`; }
  </script>
</body>
</html>
