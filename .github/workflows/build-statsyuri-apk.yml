name: Build StatsYuri APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'yugen-analytica/**'
      - 'yugen-analytica-android/**'
      - 'statsyuri-android/app/src/main/java/**'
      - '.github/workflows/build-statsyuri-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Stage stable native engine
        run: |
          DEST="yugen-analytica-android/app/src/main/java/com/yugen/statsyuri"
          mkdir -p "$DEST"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsYuriActivity.java "$DEST/StatsYuriActivity.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsBackgroundView.java "$DEST/StatsBackgroundView.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsLearningView.java "$DEST/StatsLearningView.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java "$DEST/StatisticsEngine.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("yugen-analytica-android/app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java")
          s = p.read_text()
          old = "double[][]X=xx.toArray(new double[0][]),Y=toArray(yy);"
          new = "double[][]X=xx.toArray(new double[0][]);double[]Y=toArray(yy);"
          if old not in s:
              raise SystemExit("Expected regression declaration was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build release APK
        working-directory: yugen-analytica-android
        run: gradle --no-daemon :app:assembleRelease

      - name: Show generated APK
        run: |
          find yugen-analytica-android/app/build/outputs -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-native-full-apk
          path: yugen-analytica-android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30
