name: Build StatsYuri APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'yugen-analytica/**'
      - 'yugen-analytica-android/**'
      - 'statsyuri-android/app/src/main/java/**'
      - '.github/workflows/build-statsyuri-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Stage native engine and report UI
        run: |
          DEST="yugen-analytica-android/app/src/main/java/com/yugen/statsyuri"
          mkdir -p "$DEST"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsYuriActivity.java "$DEST/StatsYuriActivity.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsBackgroundView.java "$DEST/StatsBackgroundView.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatsLearningView.java "$DEST/StatsLearningView.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java "$DEST/StatisticsEngine.java"
          cp statsyuri-android/app/src/main/java/com/yugen/statsyuri/AnalysisReportView.java "$DEST/AnalysisReportView.java"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("yugen-analytica-android/app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java")
          s=p.read_text()
          old="double[][]X=xx.toArray(new double[0][]),Y=toArray(yy);"
          new="double[][]X=xx.toArray(new double[0][]);double[]Y=toArray(yy);"
          if old not in s:
              raise SystemExit("Expected regression declaration was not found")
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build clean release APK
        working-directory: yugen-analytica-android
        run: |
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK structure before signing
        env:
          APK: yugen-analytica-android/app/build/outputs/apk/release/app-release.apk
        run: |
          test -f "$APK"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          grep -F "launchable-activity: name='com.yugenbeyondverse.statsyuri.MainActivity'" /tmp/badging.txt
          grep -F "package: name='com.yugenbeyondverse.statsyuri'" /tmp/badging.txt | grep -F "versionName='0.7.3-stable'"
          unzip -p "$APK" classes.dex | strings | grep -Fq 'Lcom/yugenbeyondverse/statsyuri/MainActivity;'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'Lcom/yugen/statsyuri/StatsYuriActivity;'

      - name: Sign APK
        env:
          INPUT: yugen-analytica-android/app/build/outputs/apk/release/app-release.apk
          OUTPUT: yugen-analytica-android/app/build/outputs/apk/release/StatsYuri-0.7.3.apk
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v               -keystore "$KEYSTORE"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --out "$OUTPUT"             "$INPUT"
          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Final APK verification
        env:
          APK: yugen-analytica-android/app/build/outputs/apk/release/StatsYuri-0.7.3.apk
        run: |
          ZIPALIGN="${ANDROID_HOME}/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "launchable-activity: name='com.yugenbeyondverse.statsyuri.MainActivity'"
          unzip -p "$APK" classes.dex | strings | grep -Fq 'Lcom/yugenbeyondverse/statsyuri/MainActivity;'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'Lcom/yugen/statsyuri/StatsYuriActivity;'
          ls -lh "$APK"

      - name: Upload only verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-0.7.3-installable-apk
          path: yugen-analytica-android/app/build/outputs/apk/release/StatsYuri-0.7.3.apk
          if-no-files-found: error
          retention-days: 30
