name: Build StatsYuri Pro APK

on:
  push:
    paths:
      - "statsyuri-android/**"
      - ".github/workflows/build-statsyuri-pro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Build native debug APK
        working-directory: statsyuri-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s statsyuri-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload StatsYuri Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-Pro-debug
          path: statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
