name: Build Yugen Game

on:
  push:
    paths:
      - "yugen-game/**"
      - ".github/workflows/yugen-game-build.yml"
  pull_request:
    paths:
      - "yugen-game/**"
      - ".github/workflows/yugen-game-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugen-game

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yugen-game/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: yugen-game-dist
          path: yugen-game/dist
