name: Build StatsYuri Working APK

on:
  push:
    paths:
      - '.github/workflows/build-statsyuri-working.yml'
      - 'statsyuri-android/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove incompatible UI class and fix regression compiler error
        working-directory: statsyuri-android
        run: |
          rm -f app/src/main/java/com/yugen/statsyuri/SettingsButtonView.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java')
          s=p.read_text()
          old='double[][]X=xx.toArray(new double[0][]),Y=toArray(yy);'
          new='double[][]X=xx.toArray(new double[0][]); double[]Y=toArray(yy);'
          if old not in s:
              raise SystemExit('Expected regression declaration was not found')
          p.write_text(s.replace(old,new,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: statsyuri-android
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh statsyuri-android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-working-debug-apk
          path: statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
