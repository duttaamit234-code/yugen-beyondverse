name: Deploy Yugen Game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'yugen-game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugen-game
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yugen-game/package.json

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify Phaser version
        run: npm ls phaser --depth=0

      - name: Build Phaser game
        run: npm run build

      - name: Verify production bundle
        run: test -f dist/index.html && test -n "$(find dist/assets -type f | head -n 1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: yugen-game/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
