name: Deploy Yugen Game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'yugen-game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugen-game
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Repair stale GameScene bootstrap call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.js')
          s = p.read_text()
          old = 'this.buildWorld(); this.buildPlayer(); this.buildCharacters();'
          new = 'this.buildWorld(); this.buildCharacters();'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Removed stale GameScene.buildPlayer() call.')
          else:
              print('GameScene bootstrap already clean.')
          PY

      - name: Commit source repair
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yugen-game/src/scenes/GameScene.js
          if git diff --cached --quiet; then
            echo "No source repair commit needed."
          else
            git commit -m "Fix GameScene bootstrap crash"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yugen-game/package.json

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify Phaser version
        run: npm ls phaser --depth=0

      - name: Verify GameScene bootstrap
        run: |
          if grep -q 'this.buildWorld(); this.buildPlayer(); this.buildCharacters();' src/scenes/GameScene.js; then
            echo 'Stale buildPlayer call remains.'
            exit 1
          fi

      - name: Build Phaser game
        run: npm run build

      - name: Verify production bundle
        run: test -f dist/index.html && test -n "$(find dist/assets -type f | head -n 1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: yugen-game/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
