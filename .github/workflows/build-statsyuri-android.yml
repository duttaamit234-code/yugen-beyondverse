name: Build StatsYuri Android

on:
  push:
    paths:
      - 'statsyuri-android/**'
      - 'yugen-analytica/**'
      - '.github/workflows/build-statsyuri-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python
        run: |
          python --version
          python3 --version
          command -v python
          command -v python3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        working-directory: statsyuri-android
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: statsyuri-android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh statsyuri-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload StatsYuri APK
        uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-debug-apk
          path: statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
