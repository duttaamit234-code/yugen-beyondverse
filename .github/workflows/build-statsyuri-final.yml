name: Build StatsYuri Final APK

on:
  push:
    paths:
      - '.github/workflows/build-statsyuri-final.yml'
      - 'statsyuri-android/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch safe engine
        working-directory: statsyuri-android
        run: |
          rm -f app/src/main/java/com/yugen/statsyuri/SettingsButtonView.java
          python3 - <<'PY'
          import base64,zlib
          b=''''''
          open('app/src/main/java/com/yugen/statsyuri/StatisticsEngine.java','wb').write(zlib.decompress(base64.b64decode(b)))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build
        working-directory: statsyuri-android
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StatsYuri-final-debug-apk
          path: statsyuri-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
